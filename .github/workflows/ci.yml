name: Day 2 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate Compose without starting services
        env:
          MYSQL_ROOT_PASSWORD: ci-config-validation-only
          TRADE_MIGRATION_PASSWORD: ci-config-validation-only
          TRADE_APP_PASSWORD: ci-config-validation-only
          REDIS_PASSWORD: ci-config-validation-only
        run: docker compose --env-file deploy/versions.env -f deploy/compose.yml config --quiet
      - name: Unit and HTTP tests
        run: bash ./mvnw -B -ntp verify
      - name: Reproducible frontend build and audit
        working-directory: web
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require Docker Linux engine
        run: docker info --format '{{.OSType}}' | grep -qx linux
      - name: Run real integration tests twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/ci
          for attempt in 1 2; do
            bash ./mvnw -B -ntp -Pintegration verify 2>&1 | tee ".tools/ci/integration-${attempt}.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-reports
          path: |
            backend/**/target/failsafe-reports/
            backend/**/target/surefire-reports/
            .tools/ci/*.txt
          if-no-files-found: warn
          retention-days: 7
