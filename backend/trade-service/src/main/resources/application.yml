spring:
  application:
    name: trade-service
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: 127.0.0.1
  port: 8080
logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
